# Project-local environment (the global Python is not touched):
#
#   mamba env create -p ./.conda-env -f environment.yml
#   ./.conda-env/bin/python -m pytest tests -q
#
# Versions are the ones that produced the committed results.
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy=2.4
  - scipy=1.17
  - scikit-learn=1.9
  - matplotlib
  - pandas
  - pytest
  - hdbscan
  - gudhi=3.13
  - pynndescent
  - psutil
  - pip
  - pip:
      - automato
      - hnswlib==0.8.0          # Phase A: approximate neighbours (16_cost.py)
      - leidenalg==0.12.0       # Phase A: Leiden reference (15, 20)
      - igraph==1.0.0
      - umap-learn==0.6.0       # Phase A: reduction before clustering (20_real_data.py)
#
# DADApy 0.3.4 needs numpy < 2 and therefore lives in a second environment,
# called through a subprocess by benchmarks/common.py:
#
#   mamba create -p ./.conda-env-dadapy -c conda-forge python=3.11 "numpy<2" scipy scikit-learn pip
#   ./.conda-env-dadapy/bin/pip install dadapy==0.3.4
#
# Phase A adds two more project-local environments.
#
# R (prototype of the R implementation, densityCut):
#
#   mamba create -p ./.conda-env-r -c conda-forge r-base=4.5 r-rcpp r-rann r-fnn r-dbscan r-jsonlite \
#       r-testthat r-devtools r-remotes r-ggplot2 r-bench r-rcpphnsw r-igraph cxx-compiler
#   PATH=$PWD/.conda-env-r/bin:$PATH ./.conda-env-r/bin/Rscript -e \
#       'remotes::install_bitbucket("jerry00/densitycut_dev")'      # densitycut 0.0.1 (not on CRAN)
#
#   Versions used: R 4.5.3, Rcpp 1.1.2, RANN 2.6.2, FNN 1.1.4.1, dbscan 1.3.0, jsonlite 2.0.0.
#   Rscript must be started with ./.conda-env-r/bin on PATH (Rcpp needs the compiler of the environment).
#
# Data preparation (benchmarks/data_prep.py only; not needed to run the benchmarks once data/ exists):
#
#   mamba create -p ./.conda-env-data -c conda-forge python=3.11 pip
#   ./.conda-env-data/bin/pip install "scanpy>=1.10" "anndata>=0.10" sentence-transformers \
#       torch --extra-index-url https://download.pytorch.org/whl/cpu
#
#   Versions used: scanpy 1.11.5, anndata 0.12.19, torch 2.15.0+cpu, sentence-transformers 6.3.0.
